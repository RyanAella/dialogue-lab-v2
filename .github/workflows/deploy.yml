name: Single-Branch Multi-Path Deployment to GitHub Pages

# Trigger only for the master branch
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Public Artifact Folder
        run: |
          mkdir -p public/dialogue-lab-v2
          cp index.html public/dialogue-lab-v2/
          cp -r src public/dialogue-lab-v2/
          cp -r scenarios public/dialogue-lab-v2/
          cp -r prompts public/dialogue-lab-v2/
          touch public/dialogue-lab-v2/.nojekyll
          
      - name: Create root 404.html for GitHub Pages fallback
        run: |
          cp 404.html public/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: false0
