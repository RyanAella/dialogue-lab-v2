name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # ← Nur main!
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public
          cp -r * public/
          cp -r .github public/
          touch public/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true  # Nur main, also clean ist OK
