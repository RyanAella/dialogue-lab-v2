name: Single-Branch Multi-Path Deployment to GitHub Pages

# Trigger only for the master branch
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Public Artifact Folder
        run: |
          mkdir -p public
          cp index.html public/
          cp 404.html public/
          cp -r src public/
          cp -r scenarios public/
          cp -r prompts public/
          touch public/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true0
